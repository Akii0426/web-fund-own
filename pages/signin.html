<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>To be determined</title>

        <link rel="stylesheet" href="../css/signin.css">
        <link rel="stylesheet" href="../css/access.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>

        <div class="center_display">

            <div class="theme-switch-wrapper">
                <label class="theme-switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
            </div>

        <div class="container">
        <div class="signup-shell">
            <div>
            <button type="button" id="backButton" class="back" >← Back</button>
            <h3>Sign Up</h3>
            <hr>
            </div>

  <div class="auth-container" id="authWrapper">
  <!-- Progress Bar Component -->
  <div class="progress-container spacing">
    <div class="progress-bar" id="progressBar"></div>
    <div class="steps-indicator">
      <span class="step-dot active">1</span>
      <span class="step-dot">2</span>
      <span class="step-dot">3</span>
    </div>
  </div>

  <form id="authForm">
    <div>
    <!-- Step 1: Email View -->
    <div class="step-content step-1">
    <h3>Create an new Account</h3>
      <label for="email" class="label-spacing"><b>Email Address</b></label>
      <input type="email" class="inputbox" id="email" required placeholder="name@example.com" />
      <button type="button" class="next-btn button spacing" data-next="2">Continue</button>

      <div class="hrspace">
            <hr><span>or</span><hr>
        </div>

        <div>
            <span>Already have an account?</span>
            <a href="access.html" class="inline-block link">Log In</a>
        </div>
    </div>

    <!-- Step 2: Password View -->
    <div class="step-content step-2">
      <h3>Create Password</h3>
      <label for="password" class="label-spacing"><b>Password</b></label>
      <input type="password" class="inputbox" id="password" required placeholder="••••••••" />

      <label for="confirmPassword" class="label-spacing"><b>Confirm Password</b></label>
      <input type="password" class="inputbox" id="confirmPassword" required placeholder="••••••••" />
      <span class="error-message" id="passwordError">Passwords do not match</span>

      <button type="button" class="next-btn button spacing" data-next="3">Continue</button>
    </div>

    <!-- Step 3: Username View -->
    <div class="step-content step-3">
      <h3>Set up Profile</h3>
        <div class="center">
      <label class="avatar-picker" for="profilePicture">
        <div id="imagePreview" class="image-preview" aria-live="polite">
          <span class="placeholder-avatar"><img src="../images/placeholder.jpg" alt="Profile Picture" class="image-preview"></span>
        </div>
        <span class="avatar-hover-text">Choose photo</span>
      </label>
      <input type="file" id="profilePicture" accept="image/*" hidden />
      </div>

      
      <label for="username"><b>Username</b></label>
      <input type="text" class="inputbox spacing" id="username" required placeholder="johndoe123" minlength="3" />
      
      <button type="submit" id="submitBtn" class="button">Complete Sign Up</button>
    </div>
    </div>
  </form>
</div>
<script src="../js/access.js"></script>
<script src="../js/signin.js"></script>
</div>
</div>
    </body>
</html>
