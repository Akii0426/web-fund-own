<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaDrop — Game Catalogue</title>
    <link rel="stylesheet" href="../css/search.css">
</head>
<body class="theme-dark">

    <a href="#main-content" class="skip-link">Skip to main content</a>


    <header class="site-header">
        <div class="navbar">
            <div class="navbar__brand">
                <span aria-hidden="true">🎮</span> NovaDrop
            </div>

            <nav class="navbar__links" aria-label="Primary navigation">
                <a href="#">Home</a>
                <a href="#">Catalogue</a>
                <a href="#">Account</a>
                <a href="#">Support</a>
            </nav>

            <button
                type="button"
                id="theme-toggle"
                class="theme-toggle"
                aria-pressed="false"
                aria-label="Switch to light theme">
                <span class="theme-toggle__icon" aria-hidden="true">☀️</span>
                <span class="theme-toggle__text">Light Mode</span>
            </button>
        </div>
    </header>

    <main id="main-content">

      
        <section id="catalogue-section" class="panel" aria-labelledby="catalogue-heading">
            <h1 id="catalogue-heading">Game Catalogue</h1>
            <p class="section-subtitle">Search, filter, and sort the NovaDrop library.</p>

            <div class="catalogue-controls">
                <div class="control-group">
                    <label for="search-input">Search by title</label>
                    <input
                        type="text"
                        id="search-input"
                        placeholder="e.g. Starforge"
                        aria-describedby="results-count">
                </div>

                <div class="control-group">
                    <label for="genre-filter">Genre</label>
                    <select id="genre-filter">
                        <option value="all">All Genres</option>
                        <option value="RPG">RPG</option>
                        <option value="Shooter">Shooter</option>
                        <option value="Strategy">Strategy</option>
                        <option value="JRPG">JRPG</option>
                        <option value="Indie">Indie</option>
                        <option value="Simulation">Simulation</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="platform-filter">Platform</label>
                    <select id="platform-filter">
                        <option value="all">All Platforms</option>
                        <option value="Windows">Windows</option>
                        <option value="Mac">Mac</option>
                        <option value="Linux">Linux</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="default">Featured</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="title-asc">Title: A–Z</option>
                        <option value="title-desc">Title: Z–A</option>
                    </select>
                </div>
            </div>

            <!-- Announces the current result count to screen reader users after every search/filter change -->
            <p id="results-count" class="results-count" role="status" aria-live="polite"></p>

            <!-- The game grid itself is also a polite live region so newly rendered
                 cards are announced as content, not silently swapped -->
            <div id="game-grid" class="game-grid" aria-live="polite"></div>

            <!-- Shown/hidden by JS when no games match the current filters -->
            <p id="empty-state" class="empty-state" role="status" hidden>
                No games match your search criteria. Try adjusting your filters.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 NovaDrop — University Web Development Assignment Demo.</p>
    </footer>

    
</body>
</html>
