<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>To be determined</title>

        <link rel="stylesheet" href="../css/access.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>

        <div class="center_display">

            <div class="theme-switch-wrapper">
                <label class="theme-switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
            </div>

        <div class="container">
        <form id="loginForm">
            <h3>Login</h3>
            <hr>

            <div class="spacing">
            <label for="loginEmail"><b>Email:</b></label>
            <input type="email" class="inputbox" id="loginEmail" name="email" placeholder="Enter Your Email Address" required>
            </div>

            <div class="spacing">
            <label for="loginPassword"><b>Password:</b></label>
            <input type="password" class="inputbox" id="loginPassword" name="password" placeholder="Password" required>
            </div>

            <span id="loginError" class="error-message" style="display:none; color:#dc2626; font-size:0.95rem; margin-top:0.75rem;">Email not registered. Please sign up first.</span>

            <div>
            <button type="submit" class="button">Login</button>
            </div>

            <div class="hrspace">
            <hr><span>or</span><hr>
            </div>

            <div>
            <a href="signin.html" class="button">Sign In</a>
            </div>

            <a href="../index.html" class="guest">Continue As Guest</a>
        </form>
        </div>

        </div>


        <script src="../js/access.js"></script>
    </body>
</html>
